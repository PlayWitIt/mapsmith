plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = 'https://maven.terraformersmc.com/releases/' }
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
	// Meteor, only to test alongside it in the development game: -PmeteorJar=/path/to/meteor-client.jar. Never bundled.
	// Its own libraries come nested in its jar, which the development game doesn't load: -PmeteorLibs=<them, unpacked>.
	if (project.hasProperty('meteorJar')) modLocalRuntime files(project.property('meteorJar'))
	if (project.hasProperty('meteorLibs')) modLocalRuntime fileTree(dir: project.property('meteorLibs'), include: '*.jar')
	testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

test {
	useJUnitPlatform()
	maxHeapSize = "768m"
	testLogging {
		events "failed"
		exceptionFormat "full"
		showStandardStreams = true
	}
}

// The scripted self-test is for development only.
jar {
	exclude 'com/greysworkshop/mapsmith/SelfTest*'
	exclude 'com/greysworkshop/mapsmith/UltimateTest*'
}

loom {
	runs {
		selfTest {
			client()
			name = "Self Test"
			vmArgs "-Dmapsmith.selftest=true", "-Dmapsmith.debug=true", "-Xmx1536m"
			runDir "run"
		}
		ultimateTest {
			client()
			name = "Ultimate Test"
			vmArgs "-Dmapsmith.ultimate=true", "-Dmapsmith.debug=true", "-Xmx1536m",
					"-Dmapsmith.ultimate.region=${findProperty('ultRegion') ?: '40,16,71,47'}",
					"-Dmapsmith.ultimate.minutes=${findProperty('ultMinutes') ?: 90}",
					"-Dmapsmith.ultimate.picture=${findProperty('ultPicture') ?: 'mapsmith/pictures/rickroll.png'}"
			runDir "run"
		}
		waterTest {
			client()
			name = "Water Test"
			vmArgs "-Dmapsmith.selftest=true", "-Dmapsmith.selftest.water=true", "-Dmapsmith.debug=true", "-Xmx1536m"
			runDir "run"
		}
		ceilingTest {
			client()
			name = "Ceiling Test"
			vmArgs "-Dmapsmith.selftest=true", "-Dmapsmith.selftest.ceiling=true", "-Dmapsmith.selftest.boxed=" + (project.findProperty("boxed") ?: "false"), "-Dmapsmith.selftest.undo=" + (project.findProperty("undo") ?: "false"), "-Dmapsmith.debug=true", "-Xmx1536m"
			runDir "run"
		}
		stairsTest {
			client()
			name = "Stairs Test"
			vmArgs "-Dmapsmith.selftest=true", "-Dmapsmith.selftest.stairs=true", "-Dmapsmith.debug=true", "-Xmx1536m"
			runDir "run"
		}
	}
}
